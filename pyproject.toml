[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = []

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["packages/core-contracts", "packages/broker-adapters", "services/execution-engine", "services/telegram-bot", "services/trainer"]
asyncio_mode = "auto"

[tool.ruff.lint.isort]
known-first-party = ["core_contracts", "broker_adapters", "execution_engine"]
