[project]
name = "execution-engine"
version = "0.1.0"
dependencies = [
    "core-contracts",
    "broker-adapters",
    "httpx",
    "pydantic-settings",
    "pydantic",
    "pyyaml",
    "lightgbm",
    "pandas",
    "sentry-sdk"
]

[project.scripts]
execution-engine = "execution_engine.main:main"

[tool.setuptools.package-dir]
"execution_engine" = "execution_engine"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
