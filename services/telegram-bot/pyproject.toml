[project]
name = "telegram-bot"
version = "0.1.0"
dependencies = [
    "core-contracts",
    "broker-adapters",
    "python-telegram-bot",
    "pydantic-settings"
]

[tool.setuptools.package-dir]
"telegram_bot" = "telegram_bot"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
